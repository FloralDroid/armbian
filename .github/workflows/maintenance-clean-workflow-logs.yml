name: "Maintenance: Clean workflow logs"

on:
  workflow_dispatch:
    inputs:
      runs_older_than:
        description: "The amount of days old to delete"
        default: "10"
        required: false

env:
  DEFAULT_RUNS_OLDER_THAN: "10"
  DEFAULT_RUNS_TO_KEEP: "0"

permissions:
  contents: read

jobs:
  clean-logs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: igorjs/gh-actions-clean-workflow@b910eb365da5e592d865ddd8a72d01cbd720b3b1 # v8.0.0
        with:
          runs_older_than: ${{ github.event.inputs.runs_older_than || env.DEFAULT_RUNS_OLDER_THAN }}
          runs_to_keep: ${{ github.event.inputs.runs_to_keep || env.DEFAULT_RUNS_TO_KEEP }}
