#
# SDM845 mobile devices using the Linux stable 6.18 kernel line.
#

declare -g LINUXFAMILY="sdm845"
declare -g OVERLAY_DIR="/boot/dtb/qcom/overlay"
declare -g ARCH="arm64"
declare -g BOOTENV_FILE="qcom-abl.txt"
declare -g KERNEL_MAJOR_MINOR="6.18"
declare -g KERNELSOURCE="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
declare -g KERNELBRANCH="commit:e8694cdbd7db99fa26f6e8c80a2a337e0de29a2f"
declare -g KERNELPATCHDIR="archive/sdm845-6.18"
declare -g LINUXCONFIG="linux-sdm845-current"
declare -g -i KERNEL_GIT_CACHE_TTL=120

enable_extension "image-output-abl"

family_tweaks_bsp() {
	:
}
